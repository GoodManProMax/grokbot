name: Update China Festival Solar Term ICS

on:
  schedule:
    # Saturday 02:20 UTC = Saturday 10:20 Asia/Shanghai.
    # 20 minutes after the statutory-holiday workflow (02:00 UTC) and
    # 20 minutes before the US-market workflow (02:40 UTC), so the three
    # calendars do not start in the same minute. Overlap still queues on
    # concurrency group ics-calendar-update (cancel-in-progress: false).
    - cron: "20 2 * * 6"
  workflow_dispatch:

concurrency:
  group: ics-calendar-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "lunar-python==1.4.8"

      - name: Regenerate China festival and solar-term ICS
        run: python scripts/update_china_festival_solarterm.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendars/china-festival-solarterm.ics
          if git diff --staged --quiet; then
            echo "No content change; skip commit."
          else
            DATE=$(date -u +%Y-%m-%d)
            git commit -m "自动更新中国非法定节日与节气日历 ${DATE}"
            git pull --rebase origin main
            git push || {
              echo "Push rejected; rebasing onto origin/main and retrying once."
              git pull --rebase origin main
              git push
            }
          fi

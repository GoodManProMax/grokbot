name: Update US Market ICS

on:
  schedule:
    # Saturday 02:40 UTC = Saturday 10:40 Asia/Shanghai.
    # Offset from the China holiday workflow (02:00 UTC) and the China
    # festival/solar-term workflow (02:20 UTC) so the three ICS jobs do not
    # start together. Shared group ics-calendar-update queues any overlap.
    - cron: "40 2 * * 6"
  workflow_dispatch:

concurrency:
  group: ics-calendar-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate US market ICS
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python scripts/update_us_market.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendars/us-market-events.ics
          if git diff --staged --quiet; then
            echo "No content change; skip commit."
          else
            DATE=$(date -u +%Y-%m-%d)
            git commit -m "自动更新美股日历 ${DATE}"
            git pull --rebase origin main
            git push || {
              echo "Push rejected; rebasing onto origin/main and retrying once."
              git pull --rebase origin main
              git push
            }
          fi
